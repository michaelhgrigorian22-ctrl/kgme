# KGME configuration. The one TOML file every module reads through kgme/config.py (ADR-015).
# Paths are relative to the repository root unless absolute. No secrets here, ever (ADR-008).

[paths]
vault = "memory"
ledger_dir = "logs/ledger"            # git-tracked, never deleted (ADR-012, ADR-019 §2)
trace_dir = "logs/trace"              # untracked, read-only tool events (ADR-019 §2)
ledger_test_dir = "logs/ledger-test"  # tests write here, never to the real streams
trace_test_dir = "logs/trace-test"
scratch_dir = "logs/scratch"
payloads_dir = "logs/scratch/payloads"
scratch_test_dir = "logs/scratch-test"  # hook tests write payloads and errors here, never to the live scratch
audit_dir = "docs/audit"                # reports; kgme review writes AUDIT-NNNN-review-* here
handoff_dir = "docs/handoff"            # adopted handoffs; kgme review finds a handoff by its id here
review_prompt = "control/review/prompt.md"
# Tier 1 is a separate repository elsewhere on disk (ADR-002). As of 2026-09-14 it does not
# exist yet (Michou, HANDOFF-0025 review F2); when it does, its absolute path is added here,
# path string only. The relative entry is the in-repo tripwire from .gitignore.
tier1_paths = ["memory/private"]

[lint]
# `kgme lint` walks these roots and skips what docs/schema-v1.md §Scope exempts (HANDOFF-0031).
roots = ["memory", "docs"]
exempt = ["memory/templates", "memory/attachments", "docs/archive", "docs/charter.md", "docs/schema-v1.md"]
skip_dirs = [".obsidian"]

[coherence]
# `kgme lint`'s coherence checks (HANDOFF-0049) are `advisory` before this day and `blocking`
# from it: promotion by date, not by hand (Cowork's ruling on review cycle 1 F5).
blocking_from = "2026-10-23"

[brief]
# `kgme brief` (HANDOFF-0034) reads every `due` instant in this zone: the day it falls on and
# the time it shows (review cycle 1 F9). An IANA name, read with the standard `zoneinfo`.
timezone = "America/Los_Angeles"

[sync]
# `kgme sync` (HANDOFF-0040) bounds every git command; a push that has not answered by then is
# killed with its helpers and recorded as one `transient` outcome, so no trigger ever hangs.
git_timeout_seconds = 60

[cockpit]
host = "127.0.0.1"
port = 8642

[clean.targets]
# Named targets for `kgme clean` (HANDOFF-0033), the only places it may delete. An entry is a
# root whose contents go (the root itself stays) or, with a `*`, a glob over the repository
# whose matches go whole; `.git` and `.venv` are never entered by a glob. logs/ledger/ is
# refused whatever is written here (ADR-012).
briefs = ["memory/agent/brief"]
agent = ["memory/agent"]
scratch = ["logs/scratch"]
trace = ["logs/trace"]
caches = ["**/__pycache__", ".ruff_cache", ".pytest_cache"]
venv = [".venv"]
ledger-test = ["logs/ledger-test", "logs/trace-test"]
# The copies `kgme capture` keeps beside a file it adds a line to (HANDOFF-0050); each goes only
# when its bytes are still what its capture recorded (kgme/clean_kept.py).
kept = ["memory/**/.*.capture-*"]

[hooks]
# Resolved-path blocklist for the pre-tool guard (HANDOFF-0028). Patterns, never contents.
blocklist = [
    "~/.ssh",
    "~/Library/Keychains",
    "~/.claude/.credentials.json",
    "~/.codex/auth.json",
    "**/.env",
    "**/.env.*",
    "**/*.env",
    "memory/private",
]
# Human-authored paths (ADR-004): file-writing tools (Write, Edit, MultiEdit, NotebookEdit) may not
# name them; an approved diff is applied through Bash instead. A directory covers its subtree, a
# glob covers one level. Guard rule 4 (HANDOFF-0032 follow-up, Michou 2026-09-23).
human_paths = ["CLAUDE.md", "docs/*.md", "docs/adr", "docs/plans", "docs/readers", "docs/archive", "docs/handoff/*.md", "memory/notes", "memory/inbox", "memory/daily"]
# Hook pairs for these tools go to logs/trace/; every other tool goes to logs/ledger/ (ADR-019 §2).
read_only_tools = ["Read", "Grep", "Glob", "LS", "TodoRead"]
# File tools (Read, Edit, Write, Glob, Grep, ...) may name paths outside the repository only under
# these roots (HANDOFF-0028 rule 2). Bash is fenced by the blocklist and the settings deny list.
allow_outside = [
    "~/.claude/jobs",
    "~/.claude/plans",
    "~/.claude/projects",  # Claude Code's own per-project memory trees (lessons, MEMORY.md)
    "/tmp",
    "/private/tmp",
    "/dev/null",
]

[canary]
# The agent tier of the canary matrix (make canary-agents, HANDOFF-0032). Enforcement does not
# depend on the model, so the cheapest capable model runs the Claude Code cells; the Codex cells
# run [models].reviewer, the profile they certify. One cell is one model run, bounded in seconds.
claude_model = "claude-haiku-4-5-20251001"
claude_max_turns = 2
cell_timeout = 150

[models]
# Review-loop identifiers. Human-readable copy: docs/readers/review-loop.md. Keep in sync by hand.
reviewer = "gpt-6-astra"
reviewer_alternate = "gpt-5.6-sol"
arbiter = "claude-opus-5-5"
