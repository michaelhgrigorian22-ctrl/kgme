[project]
name = "kgme"
version = "0.1.0"
description = "Kuang Grade Mark Eleven: Michou's local-first agent environment. Paths, config, ledger, events, CLI."
requires-python = ">=3.13"
dependencies = [
    "pyyaml==6.0.3",
]

[project.scripts]
kgme = "kgme.cli:main"

[dependency-groups]
dev = [
    "ruff==0.16.7",
    "pytest==9.1.1",
]

[build-system]
requires = ["uv_build==0.11.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "agents: launches claude -p or codex exec; excluded from make check, run by make canary-agents",
    "blocking: ADR-016 class; a failure is wrong output or a policy violation and stops the job",
    "transient: ADR-016 class; a failure is retried within bounds and never counts as a strike",
    "cosmetic: ADR-016 class; a failure is formatting and is auto-fixed or noted",
    "advisory: ADR-016 class; a failure is a suggestion for the weekly review",
]
