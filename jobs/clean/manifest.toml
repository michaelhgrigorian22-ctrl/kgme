# Worker manifest for kgme clean (ADR-013 §1, HANDOFF-0032; the tool itself is HANDOFF-0033).
# Checked by kgme/policy.py before every deletion. Paths are repository-relative; an entry with
# a * is a glob over the repository-relative path. logs/ledger/ is absent by design: the ledger
# is never a target (ADR-012). A manifest narrows, never widens: the blocklist and Tier 1 roots
# in kgme.toml are refused whatever is declared here.
name = "clean"
kind = "python-job"
max_tier = 2
read_paths = ["memory/agent", "logs/scratch", "logs/trace", "logs/ledger-test", "logs/trace-test", "logs/scratch-test", "**/__pycache__/**", ".ruff_cache", ".pytest_cache", ".venv", "kgme.toml"]
write_paths = ["memory/agent", "logs/scratch", "logs/trace", "logs/ledger-test", "logs/trace-test", "logs/scratch-test", "**/__pycache__/**", ".ruff_cache", ".pytest_cache", ".venv"]
tools = ["delete"]
network_destinations = []
