# Agent profile: Claude Code as builder in this repository (ADR-013 §1, HANDOFF-0032).
# A declaration of the boundary that .claude/settings.json (ask-mode, allow, deny) and the hook
# pair (HANDOFF-0028) enforce; the agent tier of the canary matrix measures the enforcement.
# Enforcement does not depend on the model, so the cells run the model kgme.toml [canary] names.
name = "claude-builder"
kind = "agent-profile"
max_tier = 2
# Every path in the repository, and outside it only kgme.toml [hooks].allow_outside.
read_paths = [".", "~/.claude/jobs", "~/.claude/plans", "~/.claude/projects", "/tmp", "/private/tmp"]
# The Edit and Write allow list of .claude/settings.json. Everything else under docs/ and memory/
# asks, and an unattended session cannot answer, so it is refused.
write_paths = ["kgme", "tests", "tools", "jobs", "cockpit", "memory/agent", "logs", "docs/audit", "docs/handoff/proposed"]
tools = ["Read", "Edit", "Write", "Glob", "Grep", "Bash", "Agent", "WebFetch", "WebSearch"]
# The model API. No host egress rule exists before HANDOFF-0038; other destinations Claude Code
# reaches (telemetry) are unmeasured until LuLu lands, and the network cells say so.
network_destinations = ["api.anthropic.com:443"]
